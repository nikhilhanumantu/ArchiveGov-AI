{% extends "base.html" %}

{% block title %}Password Recovery — ArchiveGov AI{% endblock %}

{% block unauth_content %}
<div class="relative min-h-screen bg-[#070B1C] text-[#E2E8F0] flex items-center justify-center p-4">
  <div class="relative z-10 w-full max-w-md">
    <div class="rounded-2xl bg-[#0e163b]/85 border border-purple-500/25 p-8 shadow-2xl backdrop-blur-2xl">
      <div class="text-center mb-6">
        <div class="w-12 h-12 mx-auto rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[28px]">lock_reset</span>
        </div>
        <h1 class="font-headline-md text-xl font-bold text-white">Reset Official Clearance</h1>
        <p class="text-xs text-slate-400 mt-1">Enter your registered government email address</p>
      </div>

      <form id="forgotForm" class="space-y-4">
        <div>
          <label class="block font-mono text-xs text-slate-300 uppercase tracking-wider mb-2" for="resetEmail">
            Official Email Address
          </label>
          <input 
            type="email" 
            id="resetEmail" 
            required
            placeholder="officer@archivegov.ai"
            class="w-full bg-[#070C20]/80 border border-slate-700 focus:border-purple-500 text-white font-sans text-sm px-4 py-3 rounded-xl transition-all"
          />
        </div>

        <button 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-sm shadow-lg hover:brightness-110 transition-all"
        >
          Dispatch Temporary Passcode
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/login" class="text-xs text-cyan-400 hover:underline flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-[14px]">arrow_back</span>
          <span>Back to Sovereign Login</span>
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    try {
      const res = await API.post('/api/v1/auth/forgot-password', { email });
      Toast.success(res.message, 'Instructions Dispatched');
      setTimeout(() => window.location.href = '/login', 2500);
    } catch (err) {
      Toast.error(err.message);
    }
  });
</script>
{% endblock %}
