<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}ArchiveGov AI — Government Records Restorer{% endblock %}</title>

  <!-- Google Fonts: Inter, Playfair Display & JetBrains Mono -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet"/>

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#d0bcff",
            "primary-container": "#a078ff",
            "on-primary-container": "#340080",
            "on-primary": "#3c0091",
            "secondary": "#5de6ff",
            "secondary-container": "#00cbe6",
            "secondary-fixed": "#a2eeff",
            "tertiary": "#efbf66",
            "tertiary-container": "#b48a36",
            "background": "#0e1224",
            "surface": "#0e1224",
            "surface-dim": "#0e1224",
            "surface-bright": "#34384b",
            "surface-container-lowest": "#090d1e",
            "surface-container-low": "#171b2c",
            "surface-container": "#1b1f30",
            "surface-container-high": "#25293b",
            "surface-container-highest": "#303447",
            "on-surface": "#dee1fa",
            "on-surface-variant": "#cbc3d7",
            "outline": "#958ea0",
            "outline-variant": "#494454",
            "error": "#ffb4ab",
            "error-container": "#93000a",
            "archival-gold": "#F5C56B",
            "archival-cyan": "#22D3EE",
            "archival-purple": "#8B5CF6"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2.5rem"
          },
          fontFamily: {
            "headline-lg": ["Playfair Display", "serif"],
            "headline-md": ["Playfair Display", "serif"],
            "headline-sm": ["Inter", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-caps": ["Inter", "sans-serif"],
            "telemetry-code": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- Custom Design System & Animations -->
  <link href="/static/css/design-system.css" rel="stylesheet"/>
  <link href="/static/css/animations.css" rel="stylesheet"/>
  {% block extra_head %}{% endblock %}
</head>

<body class="bg-[#070B1C] font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen">
  {% if user %}
    <!-- Shared Authenticated Layout -->
    {% include "components/sidebar.html" %}
    <div class="pl-72 flex flex-col min-h-screen">
      {% include "components/header.html" %}
      <main class="w-full pt-16 flex-1 bg-surface">
        {% block content %}{% endblock %}
      </main>
    </div>
  {% else %}
    <!-- Unauthenticated Fullpage Layout -->
    {% block unauth_content %}{% endblock %}
  {% endif %}

  <!-- Global Toast & Modals Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none max-w-md w-full px-4"></div>

  <!-- Core JavaScript Libraries -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/navigation.js"></script>
  {% if user %}
  <script src="/static/js/notifications.js"></script>
  {% endif %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
